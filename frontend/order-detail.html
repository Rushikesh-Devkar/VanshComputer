<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order details | Vansh Computer</title><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/checkout-flow.css"></head><body class="checkout-page"><div id="hdr"></div><main class="wrap"><header class="checkout-heading"><div><h1>Order details</h1><p id="detailHeading">Loading…</p></div></header><div class="confirmed-grid" id="detailRoot" aria-live="polite"></div></main><div id="ftr"></div><script src="js/business.js"></script><script src="js/common.js"></script><script>
renderChrome();const orderNo=new URLSearchParams(location.search).get('order')||'',root=document.getElementById('detailRoot'),wa='https://wa.me/919404948303?text='+encodeURIComponent('Hi, I need help with order '+orderNo);const money=n=>'₹ '+Number(n||0).toLocaleString('en-IN');
async function returnForm(order,aside){try{const policy=await api('/api/orders/return-policy');if(order.status!=='delivered'||!policy.returnsEnabled)return;const form=h('form',{class:'flow-card'},h('h3',{},'Request a return'),h('p',{class:'product-specs'},policy.returnPolicyText||'Return requests are subject to inspection.'),h('select',{name:'reason',required:true},h('option',{value:''},'Select reason'),...['not_as_described','defective_or_not_working','damaged_in_transit','wrong_item'].map(x=>h('option',{value:x},x.replaceAll('_',' ')))),h('textarea',{name:'details',minLength:20,maxLength:3000,required:true,placeholder:'Describe the issue (at least 20 characters)'}),h('input',{name:'proof',type:'file',accept:'image/jpeg,image/png,image/webp',multiple:true,required:true}),h('label',{},h('input',{name:'confirm',type:'checkbox',required:true}),' I understand the return and inspection conditions.'),h('button',{class:'checkout-btn',type:'submit'},'Submit return request'),h('p',{class:'checkout-status',role:'status'}));form.addEventListener('submit',async e=>{e.preventDefault();const files=form.elements.proof.files,status=form.querySelector('[role=status]');if(files.length<2||files.length>6){status.textContent='Select 2 to 6 proof photos.';return}const data=new FormData(form);try{const reply=await api('/api/orders/'+encodeURIComponent(order.orderNumber)+'/returns',{method:'POST',body:data});status.textContent='Request '+reply.requestNumber+' submitted.';form.querySelector('button').disabled=true}catch(error){status.textContent=error.message}});aside.append(form)}catch(_){}}
async function returnDetails(order,aside){
 try{
  aside.querySelectorAll('.return-detail').forEach(element=>element.remove());
  const data=await api('/api/orders/returns/mine');
  const requests=listOf(data).filter(request=>request.orderNumber===order.orderNumber);
  for(const request of requests){
   let detail=request;
   try{detail=await api('/api/orders/returns/'+encodeURIComponent(request.requestNumber)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(_){}
   const labels=['requested','awaiting_return_shipment','return_in_transit','received','inspection_accepted','inspection_rejected','refund_pending','refunded','closed'];
   const index=labels.indexOf(detail.status);
   const timeline=h('section',{class:'flow-card'},h('h3',{},'Return timeline'),...labels.slice(0,Math.max(index+1,1)).map((status,i)=>h('div',{class:'timeline-step'+(i<=index?' done':'')},h('span',{class:'timeline-marker'},i<=index?'✓':' '),h('div',{},h('b',{},String(status).replaceAll('_',' '))))));
   const block=h('section',{class:'flow-card return-detail'},h('h3',{},'Return '+detail.requestNumber),h('p',{class:'product-specs'},'Status: '+String(detail.status||'').replaceAll('_',' ')),detail.rejectionReason?h('p',{class:'checkout-error'},'Rejection reason: '+detail.rejectionReason):null,detail.adminNote?h('p',{class:'product-specs'},'Admin note: '+detail.adminNote):null,timeline);
   if(detail.status==='awaiting_return_shipment'){
    const form=h('form',{class:'account-form'},h('h3',{},'Send the product'),h('p',{class:'product-specs'},'Return address:',h('br'),detail.returnAddress||'The store will show the return address here.'),h('label',{class:'checkout-field'},'Courier',h('input',{name:'courier',required:true,maxlength:'100'})),h('label',{class:'checkout-field'},'Tracking number',h('input',{name:'trackingNumber',required:true,maxlength:'100'})),h('button',{class:'checkout-btn',type:'submit'},'Submit shipment'),h('p',{class:'checkout-status',role:'status'}));
    form.addEventListener('submit',async e=>{e.preventDefault();const statusEl=form.querySelector('[role=status]');try{await api('/api/orders/returns/'+encodeURIComponent(detail.requestNumber)+'/shipment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});statusEl.textContent='Shipment details submitted.';await returnDetails(order,aside)}catch(error){statusEl.textContent=error.message}});
    block.append(form);
   }
   if(detail.returnCourier||detail.returnTracking)block.append(h('p',{class:'product-specs'},'Shipment: '+[detail.returnCourier,detail.returnTracking?'Tracking '+detail.returnTracking:''].filter(Boolean).join(' · ')));
   aside.append(block);
  }
 }catch(_){}
}
function statusBanner(order) {
  const explanations = {
    cancelled: 'This order was cancelled. No further delivery is scheduled.',
    expired: 'Payment expired and the stock reservation was released.',
    payment_failed: 'Payment could not be completed. The order was not confirmed.',
    refund_pending: 'A refund is pending and is being processed by the payment provider.',
    refund_review: 'The refund needs manual review before it can be completed.',
    refund_failed: 'The refund failed. The store team needs to retry or review this refund.',
    refunded: 'The verified refund has been completed.',
    partially_refunded: 'A partial refund has been completed.',
  };
  const status = order.status;
  if (!explanations[status]) return null;
  return h('section',{class:'flow-card checkout-error'},h('h3',{},orderStatusLabel(status)),h('p',{},explanations[status]));
}

function deliveryTimeline(order) {
  const history = order.statusHistory || [];
  const reached = (action) => history.find((entry) => entry.action === action);
  const items = [
    ['Order placed', 'order_created', new Date(order.createdAt)],
    ['Payment confirmed', 'payment_captured', reached('payment_captured')?.at],
    ['Packed', 'processing', reached('processing')?.at],
    ['Shipped', 'shipped', reached('shipped')?.at],
    ['Out for delivery', 'out_for_delivery', reached('out_for_delivery')?.at],
    ['Delivered', 'delivered', reached('delivered')?.at || order.deliveredAt],
  ];
  const statusIndex = {
    pending_payment: 0,
    paid: 1,
    processing: 2,
    shipped: 3,
    out_for_delivery: 4,
    delivered: 5,
  };
  const current = statusIndex[order.status] ?? -1;
  return h('section',{class:'flow-card'},h('h3',{},'Delivery progress'),
    ...items.map(([label, action, at], index) => {
      const done = index <= current || (!!at && action !== 'order_created');
      const time = at ? new Date(at).toLocaleString() : 'Pending';
      return h('div',{class:'timeline-step'+(done?' done':'')},
        h('span',{class:'timeline-marker'},done?'✓':' '),
        h('div',{},h('b',{},label),h('small',{},done && at ? time : 'Pending')));
    }));
}

function render(order){
  document.getElementById('detailHeading').textContent='Order '+order.orderNumber;
  const itemCard=h('section',{class:'flow-card'},
    h('h2',{},'Items'),
    ...order.items.map(item=>h('div',{class:'mini-product'},
      item.imageUrl?h('img',{src:img(item.imageUrl,160),alt:item.name}):null,
      h('div',{},h('strong',{},item.name),h('small',{},'Qty '+item.quantity)),
      h('b',{},money(item.lineTotal))
    ))
  );
  const address=order.address||{};
  const banner=statusBanner(order);
  const progress=banner?banner:deliveryTimeline(order);
  const left=h('div',{},
    itemCard,
    progress,
    h('section',{class:'flow-card'},h('h3',{},'Delivery address'),h('p',{class:'address-preview'},[address.line1,address.line2,address.city,address.district,address.state,address.pinCode].filter(Boolean).join(', '))),
    h('section',{class:'whatsapp-help'},h('b',{},'Need help?'),h('a',{class:'checkout-ghost full',href:wa,target:'_blank',rel:'noopener'},'Chat on WhatsApp')));
  const aside=h('aside',{},
    h('section',{class:'flow-card'},h('h3',{},'Payment summary'),
      ...[['Subtotal',order.subtotal],['Discount',-order.discount],['Delivery',order.shippingCharge],['Total',order.total],['Payment status',String(order.paymentStatus).replaceAll('_',' ')],['Payment ID',order.paymentId||'Not captured']].map(([k,v])=>h('div',{class:'summary-row'},h('span',{},k),h('b',{},typeof v==='number'?money(v):v))),
      h('p',{},order.courierName?'Courier: '+order.courierName:'Courier details appear after dispatch',order.trackingNumber?' · AWB: '+order.trackingNumber:'')));
  if(order.trackingUrl){
    aside.querySelectorAll('.courier-track-link').forEach(element=>element.remove());
    aside.append(h('a',{class:'checkout-btn full courier-track-link',href:order.trackingUrl,target:'_blank',rel:'noopener noreferrer'},'Track on courier site'));
  }
  if(['shipped','out_for_delivery'].includes(order.status)&&order.deliveryOtp){
    aside.append(h('section',{class:'flow-card'},
      h('h3',{},'Delivery OTP'),
      h('b',{style:'font-size:24px;letter-spacing:4px'},order.deliveryOtp),
      h('p',{class:'checkout-error'},'Share this OTP only with the delivery person when you receive your parcel.')
    ));
  }
  root.replaceChildren(left,aside);
  returnForm(order,aside);
  returnDetails(order,aside);
}
if(!orderNo)root.replaceChildren(h('p',{class:'checkout-error'},'Order number is missing.'));else api('/api/orders/mine/'+encodeURIComponent(orderNo)).then(render).catch(error=>{if(error.message==='Login required'||error.message.includes('Session expired'))location.replace('account.html?next=track-order.html&oid='+encodeURIComponent(orderNo));else root.replaceChildren(h('p',{class:'checkout-error'},error.message),h('a',{class:'checkout-btn',href:'account.html'},'Back to account'))});
</script></body></html>
