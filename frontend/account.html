<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your account | Vansh Computer</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/checkout-flow.css"><style>
.account-wrap{max-width:480px;margin:30px auto 60px}.account-box{max-width:420px;margin:0 auto;padding:clamp(18px,4vw,28px);border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 10px 32px rgba(15,23,42,.06)}.account-box h1{margin:0 0 8px}.account-switch{display:flex;gap:8px;margin:20px 0}.account-switch button{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:700;cursor:pointer}.account-switch button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.account-form{display:grid;gap:14px}.account-orders{display:grid;gap:10px;margin-top:20px}.account-order{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px;border:1px solid var(--line);border-radius:10px}.account-order small{display:block;margin-top:5px;color:var(--muted)}.account-error{color:#b42318}.account-note{color:var(--muted);font-size:13px;line-height:1.6}@media(max-width:520px){.account-order{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="hdr"></div><main class="wrap account-wrap"><section class="account-box" id="accountRoot" aria-live="polite"><p>Loading your account…</p></section></main><div id="ftr"></div><script src="js/business.js"></script><script src="js/common.js"></script><script>
renderChrome();const root=document.getElementById('accountRoot'),params=new URLSearchParams(location.search);let mode='login',account=null;
function showForm(error=''){root.replaceChildren(h('h1',{},mode==='login'?'Sign in':'Create your account'),h('p',{class:'account-note'},'Use your account to place orders and see your order history.'),h('div',{class:'account-switch'},h('button',{type:'button','aria-pressed':String(mode==='login'),onclick:()=>{mode='login';showForm()}},'Sign in'),h('button',{type:'button','aria-pressed':String(mode==='register'),onclick:()=>{mode='register';showForm()}},'Create account')),h('form',{class:'account-form',id:'accountForm'},mode==='register'?h('label',{class:'checkout-field'},'Full name',h('input',{name:'name',required:true,minlength:'2',maxlength:'100',autocomplete:'name'})):null,h('label',{class:'checkout-field'},'Email',h('input',{name:'email',type:'email',required:true,autocomplete:'email',maxlength:'200'})),h('label',{class:'checkout-field'},'Password',h('input',{name:'password',type:'password',required:true,minlength:'10',maxlength:'100',autocomplete:mode==='login'?'current-password':'new-password'})),h('p',{class:'account-note'},'Passwords must be at least 10 characters. Your session uses a secure, HTTP-only cookie.'),error?h('p',{class:'account-error',role:'alert'},error):null,h('button',{class:'checkout-btn',type:'submit'},mode==='login'?'Sign in':'Create account')));document.getElementById('accountForm').addEventListener('submit',submitAccount)}
async function submitAccount(event){event.preventDefault();const body=Object.fromEntries(new FormData(event.currentTarget));try{account=await api('/api/customer/'+(mode==='login'?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(params.get('next')==='cart.html')location.replace('cart.html');else renderAccount()}catch(error){showForm(error.message)}}
