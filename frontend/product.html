<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop | Vansh Computer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.pd{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:start;margin-top:24px}
.main-ph{background:var(--bg);border-radius:16px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#8a8a8a;overflow:hidden}
.main-ph img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:80px;height:60px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--red)}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #eee;font-size:15px}
.row span:first-child{color:var(--muted)}
.box{background:var(--bg);border-radius:14px;padding:20px;margin-top:20px;display:flex;flex-direction:column;gap:10px}
h2{font-size:22px;margin:32px 0 8px}
.review-layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr);gap:24px;margin:18px 0 48px;align-items:start}.review-form,.review-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.review-form{display:grid;gap:12px}.review-form label{display:grid;gap:6px;font-size:13px;font-weight:700}.review-form input,.review-form textarea,.review-form select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}.review-form textarea{min-height:110px;resize:vertical}.review-list{display:grid;gap:12px}.review-card p{margin:10px 0;line-height:1.6;white-space:pre-line}.review-stars{color:#E99A13;letter-spacing:2px}.review-photos{display:flex;gap:8px;flex-wrap:wrap}.review-photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}.review-status{min-height:20px}.review-status.error{color:#b91c1c}
@media(max-width:700px){.review-layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hdr"></div>
<main class="wrap" id="app"><p class="muted">Loading...</p></main>
<div id="ftr"></div>
<script src="js/common.js"></script>
<script>
renderChrome();
const app = document.getElementById('app');
const slug = new URLSearchParams(location.search).get('slug');

function render(p) {
  document.title = p.name + ' | Vansh Computer';
  const sold = p.status === 'sold' || p.stock < 1;
  const r = p.refurbished;
  const photos = p.images || [];

  const mainPh = h('div', { class: 'main-ph' }, photos[0] ? h('img', { src: img(photos[0].url, 1000), alt: photos[0].alt || p.name }) : 'Photo jald aayegi');
  const thumbs = h('div', { class: 'thumbs' }, photos.length > 1 ? photos.map((ph, i) => h('img', {
    src: img(ph.url, 200), alt: ph.alt || p.name, class: i === 0 ? 'on' : '',
    onclick: (ev) => {
      mainPh.replaceChildren(h('img', { src: img(ph.url, 1000), alt: ph.alt || p.name }));
      thumbs.querySelectorAll('img').forEach((x) => x.classList.remove('on'));
      ev.target.classList.add('on');
    },
  })) : []);

  const cartStatus = h('p', { class: 'muted', role: 'status', 'aria-live': 'polite' });
  const addToCart = h('button', { class: 'btn', type: 'button', disabled: sold }, sold ? 'Sold out' : 'Add to Cart');
  addToCart.addEventListener('click', () => {
    try {
      const cart = getCart();
      const existing = cart.find((item) => item.slug === p.slug);
      const maxQuantity = p.type === 'refurbished' ? 1 : Math.min(10, Number(p.stock) || 0);
      if (existing && existing.quantity >= maxQuantity) {
        cartStatus.textContent = 'Maximum available quantity is already in your cart.';
        return;
      }
      if (existing) existing.quantity += 1;
      else cart.push({ productId: p._id, slug: p.slug, quantity: 1 });
      localStorage.setItem('vanshCart', JSON.stringify(cart));
      updateCartCount();
      cartStatus.textContent = p.name + ' added to cart.';
      addToCart.textContent = 'Add another';
    } catch (_) {
      cartStatus.textContent = 'Cart storage is unavailable in this browser. Please use WhatsApp to order.';
    }
  });

  const waMessage = `Hi, I'm interested in "${p.name}". I would like to get more information about this product.\n\nProduct Link: ${window.location.href}`;
  const wa = /^\d{12}$/.test(STORE.whatsapp)
    ? h('a', { class: 'btn line', target: '_blank', rel: 'noopener', href: 'https://wa.me/' + STORE.whatsapp + '?text=' + encodeURIComponent(waMessage) }, 'Ask on WhatsApp')
    : null;

  const spec = (k, v) => v ? h('div', { class: 'row' }, h('span', {}, k), h('span', {}, v)) : null;

  const reviewSection = h('section', { class: 'product-reviews' },
    h('h2', {}, 'Customer reviews'),
    h('p', { class: 'muted' }, 'Share your experience with this product. Reviews are checked before they appear.'),
    h('div', { class: 'review-layout' },
      h('form', { class: 'review-form', id: 'reviewForm', enctype: 'multipart/form-data' },
        h('b', {}, 'Write a review'),
        h('label', {}, 'Your name', h('input', { name: 'customerName', maxlength: '80', required: true, autocomplete: 'name' })),
        h('label', {}, 'Your rating', h('select', { name: 'rating', required: true }, [h('option', { value: '' }, 'Choose a rating'), ...[1,2,3,4,5].map((value) => h('option', { value }, `${value} star${value === 1 ? '' : 's'}`))])),
        h('label', {}, 'Your review', h('textarea', { name: 'text', maxlength: '1200', required: true, placeholder: 'What did you think about this product?' })),
        h('label', {}, 'Photos (optional, up to 3)', h('input', { name: 'images', type: 'file', accept: 'image/jpeg,image/png,image/webp', multiple: true })),
        h('button', { class: 'btn', type: 'submit' }, 'Submit review'),
        h('p', { class: 'muted review-status', id: 'reviewStatus', role: 'status' })),
      h('div', { class: 'review-list', id: 'productReviews' }, h('p', { class: 'muted' }, 'Loading reviews...'))));

  app.replaceChildren(
    h('div', { class: 'pd' },
      h('div', {}, mainPh, thumbs),
      h('div', {},
        h('div', {}, p.type === 'refurbished' ? [r && r.grade ? h('span', { class: 'badge' }, 'Grade ' + r.grade) : null, r && r.batteryHealth != null ? h('span', { class: 'badge red' }, 'Battery health ' + r.batteryHealth + '%') : null, h('span', { class: 'badge red' }, 'Refurbished')] : h('span', { class: 'badge' }, 'New')),
        h('h1', { style: 'margin-top:12px' }, p.name),
        h('p', { class: 'muted' }, [p.specs && p.specs.cpu, p.specs && p.specs.ram, p.specs && p.specs.storage].filter(Boolean).join(' · ') + (p.sku ? ' · SKU: ' + p.sku : '')),
        h('div', { class: 'price-container', style: 'margin:12px 0 4px' }, h('p', { class: 'price', style: 'font-size:32px;margin:0' }, sold ? 'Sold out' : rupee(p.price)), !sold && Number(p.originalPrice) > Number(p.price) ? [h('del', { class: 'original-price' }, rupee(p.originalPrice)), h('span', { class: 'badge discount' }, Math.round((Number(p.originalPrice) - Number(p.price)) / Number(p.originalPrice) * 100) + '% OFF')] : null),
        h('p', { class: 'muted' }, sold ? 'Ye laptop bik chuka hai.' : (p.type === 'refurbished' ? 'Sirf 1 piece available · ' : '') + p.warrantyMonths + ' months warranty · Online payment'),
        addToCart, cartStatus,
        wa ? h('div', { style: 'margin-top:12px' }, wa) : null)),
    p.description ? h('p', { class: 'muted', style: 'margin-top:18px;white-space:pre-line' }, p.description) : null,
    h('h2', {}, 'Product details'),
    spec('Section', p.section === 'accessories' ? 'Accessories' : 'Laptops'),
    spec('Category', p.subcategory || p.category),
    spec('Brand', p.brand), spec('Processor', p.specs.cpu), spec('RAM', p.specs.ram), spec('Storage', p.specs.storage),
    spec('Graphics', p.specs.gpu), spec('Display', p.specs.screen), spec('Operating system', p.specs.os), spec('Warranty', p.warrantyMonths + ' months'),
    r && (r.cosmeticNotes || (r.inspectionChecklist || []).length || (r.includedAccessories || []).length) ? [
      h('h2', {}, 'Condition aur inspection'),
      r.cosmeticNotes ? h('p', { class: 'muted' }, r.cosmeticNotes) : null,
      (r.inspectionChecklist || []).map((x) => h('div', { class: 'row' }, h('span', {}, '✓ ' + x), h('span', {}, ''))),
      (r.includedAccessories || []).length ? h('p', { class: 'muted' }, 'Box mein: ' + r.includedAccessories.join(', ')) : null,
    ] : null,
    reviewSection);

  loadProductReviews(p._id);
  const reviewForm = document.getElementById('reviewForm');
  reviewForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const status = document.getElementById('reviewStatus');
    status.classList.remove('error'); status.textContent = '';
    const files = reviewForm.elements.images.files;
    if (files.length > 3 || [...files].some((file) => file.size > 5 * 1024 * 1024)) {
      status.classList.add('error'); status.textContent = 'Choose up to 3 images, each 5 MB or smaller.'; return;
    }
    const button = reviewForm.querySelector('button'); button.disabled = true;
    const data = new FormData(reviewForm); data.append('productId', p._id);
    try {
      const response = await api('/api/reviews', { method: 'POST', body: data });
      status.textContent = response.message; reviewForm.reset();
    } catch (error) { status.classList.add('error'); status.textContent = error.message; }
    finally { button.disabled = false; }
  });
}

function reviewCard(review) {
  const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
  return h('article', { class: 'review-card' },
    h('div', { class: 'review-stars', 'aria-label': `${review.rating} out of 5 stars` }, stars),
    h('b', {}, review.customerName),
    h('p', {}, review.text),
    (review.images || []).length ? h('div', { class: 'review-photos' }, review.images.map((image) => h('img', { src: image.url, alt: 'Customer review photo', loading: 'lazy' }))) : null);
}
async function loadProductReviews(productId) {
  const list = document.getElementById('productReviews');
  try {
    const reviews = listOf(await api('/api/reviews?product=' + encodeURIComponent(productId)));
    list.replaceChildren(...(reviews.length ? reviews.map(reviewCard) : [h('p', { class: 'muted' }, 'No approved reviews yet. Be the first to share yours.')]));
  } catch (error) { list.replaceChildren(h('p', { class: 'muted' }, error.message)); }
}

(async () => {
  if (!slug) { app.replaceChildren(h('p', { class: 'muted' }, 'Laptop nahi mila.')); return; }
  try { render(await api('/api/products/' + encodeURIComponent(slug))); }
  catch (e) { app.replaceChildren(h('p', { class: 'muted' }, e.message)); }
})();
</script>
</body>
</html>
