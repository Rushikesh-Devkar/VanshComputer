<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password | Vansh Computer</title><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/checkout-flow.css"></head><body><div id="hdr"></div><main class="wrap" style="max-width:520px;margin:40px auto"><section class="flow-card"><h1>Choose a new password</h1><form id="resetForm" class="account-form"><label class="checkout-field">New password<input name="password" type="password" minlength="10" maxlength="100" autocomplete="new-password" required></label><p id="resetMessage" role="status"></p><button class="checkout-btn">Reset password</button></form><a href="account.html">Back to sign in</a></section></main><div id="ftr"></div><script src="js/business.js"></script><script src="js/common.js"></script><script>renderChrome();document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('resetMessage');try{const body=Object.fromEntries(new FormData(e.currentTarget));body.token=new URLSearchParams(location.search).get('token')||'';const result=await api('/api/customer/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});message.textContent=result.message;setTimeout(()=>location.href='account.html',1800)}catch(error){message.textContent=error.message}});</script></body></html>
