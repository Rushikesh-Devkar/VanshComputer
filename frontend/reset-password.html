<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Vansh Computer</title>
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/checkout-flow.css">
</head>
<body>
  <div id="hdr"></div>
  <main class="wrap" style="max-width:520px;margin:40px auto">
    <section class="flow-card">
      <h1>Choose a new password</h1>
      <form id="resetForm" class="account-form">
        <label class="checkout-field">New password
          <input name="password" type="password" minlength="10" maxlength="100" autocomplete="new-password" required>
        </label>
        <label class="checkout-field">Confirm new password
          <input name="confirmPassword" type="password" minlength="10" maxlength="100" autocomplete="new-password" required>
        </label>
        <p id="resetMessage" role="status" aria-live="polite"></p>
        <p id="loginLink" hidden><a href="account.html">Sign in to your account</a></p>
        <button class="checkout-btn" type="submit">Reset password</button>
      </form>
      <a href="account.html">Back to sign in</a>
    </section>
  </main>
  <div id="ftr"></div>
  <script src="js/business.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderChrome();
    const resetForm = document.getElementById('resetForm');
    const resetMessage = document.getElementById('resetMessage');
    const loginLink = document.getElementById('loginLink');
    const resetToken = new URLSearchParams(location.search).get('token') || '';
    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = resetForm.querySelector('button[type="submit"]');
      const values = Object.fromEntries(new FormData(resetForm));
      if (!resetToken) {
        resetMessage.textContent = 'This reset link is invalid or expired. Request a new one and try again.';
        return;
      }
      if (values.password.length < 10) {
        resetMessage.textContent = 'Use a password with at least 10 characters.';
        return;
      }
      if (values.password !== values.confirmPassword) {
        resetMessage.textContent = 'The passwords do not match.';
        return;
      }
      button.disabled = true;
      resetMessage.textContent = '';
      try {
        const result = await api('/api/customer/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, password: values.password }),
        });
        resetMessage.textContent = result.message;
        loginLink.hidden = false;
        resetForm.querySelectorAll('input').forEach((input) => { input.disabled = true; input.value = ''; });
        button.hidden = true;
      } catch (error) {
        resetMessage.textContent = error.message || 'Could not reset your password. Request a new link and try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
