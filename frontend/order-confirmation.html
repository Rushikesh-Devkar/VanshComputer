<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order confirmation | Vansh Computer</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/checkout-flow.css"></head>
<body class="checkout-page"><div id="hdr"></div><main class="wrap"><header class="checkout-heading"><div><h1>Order confirmation</h1><p>Your payment and order details.</p></div><span class="checkout-lock">🔒 Secure checkout</span></header><div class="checkout-stepper" id="confirmationStepper" aria-label="Checkout progress"></div><div id="confirmationContent" class="checkout-panel" aria-live="polite"><div class="summary-skeleton"></div><div class="summary-skeleton"></div></div></main><div id="ftr"></div><script src="js/common.js"></script><script>

 const paid=receipt.paymentStatus==='captured'&&['paid','processing','shipped','delivered'].includes(receipt.status),waiting=!paid;const stepper=document.getElementById('confirmationStepper'),steps=['Cart','Delivery','Payment','Done'],active=paid?3:2;stepper.replaceChildren(...steps.map((label,index)=>{const done=index<active,el=h('span',{class:'checkout-step'+(index===active?' is-current':'')+(done?' is-done':'')},h('span',{class:'step-dot'},done?'✓':String(index+1)),label);return index<steps.length-1?[el,h('span',{class:'step-line'})]:el}).flat());

function downloadReceipt(){if(!receipt)return;const rows=(receipt.items||[]).map(i=>`${i.name} × ${i.quantity} — ${money(i.unitPrice* i.quantity)}`).join('\n');const body=['Vansh Computer — Order receipt','Order ID: '+orderNumber,'Payment ID: '+(receipt.paymentId||'Pending'),'Payment status: '+(receipt.paymentStatus||'Pending'),'','Items:',rows,'','Delivery: '+money(receipt.shippingCharge),'Total: '+money(receipt.total),'','This is an order receipt, not a GST tax invoice.'].join('\n');const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='vansh-order-'+orderNumber+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
