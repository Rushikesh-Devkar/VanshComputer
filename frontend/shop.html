<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Vansh Computer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.shop-banner{position:relative;isolation:isolate;display:block;aspect-ratio:2400 / 567;overflow:hidden;border-radius:18px;background:#fff;color:#fff;margin:26px 0}.shop-banner img{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}.shop-banner img[hidden]{display:none}.category-links{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.category-links a{border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:700}.category-links a.active,.category-links a:hover{background:var(--accent);border-color:var(--accent);color:#fff}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}.filters label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:700}.filters select,.filters input{width:100%;min-width:0}.filter-group{display:flex;gap:7px}.filter-group input{min-width:0}
#filters{display:grid;gap:18px;padding:20px;border:1px solid var(--line);border-radius:16px;background:#F8FAFC;overflow:visible}
.filter-section-title{margin:0 0 12px;color:var(--ink);font-size:14px;font-weight:800}
.filter-primary,.filter-advanced-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:16px;align-items:end}
#filters label{display:grid;min-width:0;gap:7px;color:#475569;font-size:13px;font-weight:700}
#filters select,#filters input{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid #CBD5E1;border-radius:9px;background:#fff;font:inherit;font-size:14px;transition:border-color .18s,box-shadow .18s}
#filters input:focus,#filters select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
#filters [hidden]{display:none}
.filter-group{display:flex;gap:8px}.filter-group input{min-width:0}
.advanced-filters{border-top:1px solid var(--line);padding-top:14px}
.advanced-filters summary{display:flex;align-items:center;gap:9px;width:max-content;max-width:100%;color:var(--accent-dark);font-weight:800;font-size:14px;cursor:pointer;list-style:none}
.advanced-filters summary::-webkit-details-marker{display:none}
.advanced-filters summary::after{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg);transition:transform .15s}
.advanced-filters[open] summary::after{transform:rotate(225deg)}
.advanced-filters summary:focus-visible{outline:3px solid var(--accent-soft);outline-offset:4px;border-radius:4px}
.filter-advanced-grid{padding-top:16px}
@media(max-width:600px){#filters{padding:15px}.filter-primary,.filter-advanced-grid{grid-template-columns:1fr}}
nav.category-links{align-items:center;gap:10px;margin:18px 0 12px;padding-bottom:14px;border-bottom:1px solid #E2E8F0}
nav.category-links a{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;padding:10px 16px;border:1px solid #E2E8F0;border-radius:12px;background:#fff;color:#64748B;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .2s,border-color .2s,background-color .2s,color .2s,box-shadow .2s}
nav.category-links a:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 5px 12px rgba(15,23,42,.1)}
nav.category-links a.active{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 8px 16px rgba(37,99,235,.22)}
nav.category-links a.active:hover{background:var(--accent-dark);color:#fff}
.category-icon{width:17px;height:17px;flex:none}
nav#accessoryLinks{gap:8px;margin:0 0 22px;padding:16px;border:1px solid #E8EDF5;border-radius:16px;background:#F8FAFC;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
nav#accessoryLinks[hidden]{display:none}
.nav-context{flex:none;padding:0 8px 0 2px;color:#64748B;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
nav#accessoryLinks a{padding:8px 13px;border-radius:10px;background:rgba(255,255,255,.82);font-size:13px}
.shop-breadcrumb{display:flex;align-items:center;gap:9px;margin:22px 0 2px;color:var(--muted);font-size:13px}
.shop-breadcrumb a{color:var(--accent);font-weight:700}.shop-breadcrumb a:hover{text-decoration:underline}
.shop-breadcrumb span[aria-hidden="true"]{color:#94A3B8}
@media(max-width:768px){nav.category-links{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}nav#accessoryLinks{flex-wrap:nowrap;overflow-x:auto}.shop-breadcrumb{margin-top:18px}}
@media(max-width:700px){.shop-banner{border-radius:12px}}
</style>
</head>
<body>
<div id="hdr"></div>
<main class="wrap">
  <section class="shop-banner no-image" id="shopBanner">
    <img id="shopBannerImage" alt="Shop offer" hidden>
  </section>
  <nav class="shop-breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">›</span><a href="shop.html">Shop</a><span aria-hidden="true">›</span><span id="breadcrumbCurrent" aria-current="page">All products</span></nav>
  <h1 id="title">All products</h1>
  <nav class="category-links" aria-label="Shop sections">
    <a href="shop.html" data-section="all"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4M8 11h6M11 8v6"/></svg>All products</a>
    <a href="shop.html?section=laptop" data-section="laptop"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M2 20h20l-2-4H4l-2 4Z"/></svg>Laptops</a>
    <a href="shop.html?section=accessories" data-section="accessories"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Accessories</a>
    <a href="shop.html?category=desktop" data-category="desktop"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v4m-4 0h8"/></svg>Desktops</a>
    <a href="shop.html?category=monitor" data-category="monitor"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v3m-4 0h8"/></svg>Monitors</a>
    <a href="shop.html?category=printer" data-category="printer"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8V3h10v5M6 17H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>Printers</a>
    <a href="shop.html?category=tablet" data-category="tablet"><svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg>Tablets / iPad</a>
  </nav>
  <nav class="category-links" id="accessoryLinks" aria-label="Accessory categories" hidden>
    <span class="nav-context">Browse accessory types</span>
    <a href="shop.html?section=accessories">All accessories</a>
    <a href="shop.html?section=accessories&subcategory=mouse">Mouse</a>
    <a href="shop.html?section=accessories&subcategory=keyboard">Keyboard</a>
    <a href="shop.html?section=accessories&subcategory=keypad">Keypad</a>
    <a href="shop.html?section=accessories&subcategory=printer">Printer</a>
    <a href="shop.html?section=accessories&subcategory=charger">Charger</a>
    <a href="shop.html?section=accessories&subcategory=bag">Bag</a>
    <a href="shop.html?section=accessories&subcategory=mouse%20pad">Mouse pad</a>
    <a href="shop.html?section=accessories&subcategory=laptop%20stand">Laptop stand</a>
    <a href="shop.html?section=accessories&subcategory=headphones">Headphones</a>
    <a href="shop.html?section=accessories&subcategory=bluetooth%20speaker">Bluetooth</a>
    <a href="shop.html?section=accessories&subcategory=tablet">iPad / Tablet</a>
  </nav>
  <div id="filters">
    <section>
      <h2 class="filter-section-title">Main filters</h2>
      <div class="filter-primary">
    <label>Search product<input id="search" type="search" placeholder="Brand, model, SKU"></label>
    <label>Section<select id="section"><option value="">All sections</option><option value="laptop">Laptops</option><option value="accessories">Accessories</option></select></label>
    <label>Product type<select id="category"><option value="">All types</option><option value="desktop">Desktop</option><option value="monitor">Monitor</option><option value="printer">Printer</option><option value="tablet">Tablet / iPad</option></select></label>
    <label id="subcategoryFilter">Accessory type<select id="subcategory"><option value="">All accessories</option><option>mouse</option><option>keyboard</option><option>keypad</option><option>printer</option><option>charger</option><option>bag</option><option>mouse pad</option><option>laptop stand</option><option>headphones</option><option>bluetooth speaker</option><option>earbuds</option><option>tablet</option><option>webcam</option><option>cable</option><option>adapter</option></select></label>
    <label>Condition<select id="type"><option value="">New + refurbished</option><option value="new">New</option><option value="refurbished">Refurbished</option></select></label>
    <label>Brand<select id="brand"><option value="">All brands</option></select></label>
    <label>Price range (₹)<span class="filter-group"><input id="minPrice" type="number" min="0" placeholder="Min"><input id="maxPrice" type="number" min="0" placeholder="Max"></span></label>
      </div>
    </section>
    <details class="advanced-filters" id="advancedFilters">
      <summary>Advanced filters</summary>
      <div class="filter-advanced-grid">
    <label data-spec-filter>Storage range (GB)<span class="filter-group"><input id="minStorage" type="number" min="0" placeholder="Min"><input id="maxStorage" type="number" min="0" placeholder="Max"></span></label>
    <label data-spec-filter>RAM<select id="ram"><option value="">Any RAM</option><option value="4">4 GB</option><option value="8">8 GB</option><option value="16">16 GB</option><option value="32">32 GB+</option></select></label>
    <label data-spec-filter>Processor<input id="cpu" type="search" placeholder="Intel Core i5, Ryzen 5"></label>
    <label data-spec-filter>Graphics / GPU<input id="gpu" type="search" placeholder="Intel, RTX, Radeon"></label>
    <label data-spec-filter>Display<input id="screen" type="search" placeholder="14 inch, FHD, OLED"></label>
    <label>Availability<select id="inStock"><option value="">All stock</option><option value="1">In stock only</option></select></label>
    <label>Refurbished grade<select id="grade"><option value="">Any grade</option><option value="A">Grade A</option><option value="B">Grade B</option><option value="C">Grade C</option></select></label>
    <label>Sort by<select id="sort"><option value="newest">Newest</option><option value="priceAsc">Price: low to high</option><option value="priceDesc">Price: high to low</option></select></label>
      </div>
    </details>
  </div>
  <div id="grid" class="grid" style="margin-top:24px"></div>
</main>
<div id="ftr"></div>
<script src="js/business.js"></script><script src="js/common.js"></script>
<script>
renderChrome();
const qs = new URLSearchParams(location.search);
const fields = ['search','section','category','subcategory','type','brand','minPrice','maxPrice','minStorage','maxStorage','ram','cpu','gpu','screen','inStock','grade','sort'];
const f = Object.fromEntries(fields.map((id) => [id, document.getElementById(id)]));
for (const id of fields) if (qs.has(id)) f[id].value = qs.get(id);
if (qs.has('brand') && ![...f.brand.options].some((option) => option.value.toLowerCase() === qs.get('brand').toLowerCase())) f.brand.add(new Option(qs.get('brand'), qs.get('brand')));
if (qs.has('q')) f.search.value = qs.get('q');
const section = qs.get('section') || '';
document.getElementById('accessoryLinks').hidden = section !== 'accessories';
document.getElementById('subcategoryFilter').hidden = section !== 'accessories';
document.querySelectorAll('[data-spec-filter]').forEach((label) => { label.hidden = section === 'accessories'; });
const specFieldIds = ['minStorage','maxStorage','ram','cpu','gpu','screen'];
if (section === 'accessories') specFieldIds.forEach((id) => { f[id].value = ''; });
document.getElementById('advancedFilters').open = ['minStorage','maxStorage','ram','cpu','gpu','screen','inStock','grade','sort'].some((id) => qs.has(id));
document.getElementById('title').textContent = section === 'accessories' ? 'Accessories' : section === 'laptop' ? 'Laptops' : 'All products';
if (qs.has('category') && qs.get('category') !== 'accessories' && qs.get('category') !== 'laptop') {
  const label = { desktop: 'Desktops', monitor: 'Monitors', printer: 'Printers', tablet: 'Tablets / iPad' }[qs.get('category')];
  if (label) document.getElementById('title').textContent = label;
}
const selectedCategory = qs.get('category') || '';
document.querySelectorAll('[data-section]').forEach((link) => {
  if (section ? link.dataset.section === section : !selectedCategory && link.dataset.section === 'all') link.classList.add('active');
});
document.querySelectorAll('[data-category]').forEach((link) => { if (link.dataset.category === selectedCategory) link.classList.add('active'); });
let breadcrumbLabel = section === 'accessories' ? 'Accessories' : section === 'laptop' ? 'Laptops' : '';
if (section === 'accessories' && qs.has('subcategory')) breadcrumbLabel += ' / ' + qs.get('subcategory').replace(/\b\w/g, (letter) => letter.toUpperCase());
if (!breadcrumbLabel && selectedCategory) breadcrumbLabel = ({ desktop: 'Desktops', monitor: 'Monitors', printer: 'Printers', tablet: 'Tablets / iPad' })[selectedCategory] || 'Shop';
if (!breadcrumbLabel && qs.has('brand')) breadcrumbLabel = qs.get('brand') + ' laptops';
if (!breadcrumbLabel && qs.has('maxPrice')) breadcrumbLabel = (qs.get('type') === 'refurbished' ? 'Refurbished ' : '') + 'Under ₹' + Number(qs.get('maxPrice')).toLocaleString('en-IN');
document.getElementById('breadcrumbCurrent').textContent = breadcrumbLabel || 'All products';

async function loadShopBanner() {
  try {
    const banner = await api('/api/banner');
    if (banner.shopImageUrl) {
      const image = document.getElementById('shopBannerImage'); image.src = banner.shopImageUrl; image.hidden = false;
    }
  } catch (error) { console.error('Shop banner load failed:', error.message); }
}
loadShopBanner();

async function load() {
  const params = new URLSearchParams();
  for (const id of fields) if (f[id].value) params.set(id === 'search' ? 'q' : id, f[id].value.trim());
  const grid = document.getElementById('grid'); grid.replaceChildren(h('p', { class: 'muted' }, 'Loading...'));
  try {
    const items = listOf(await api('/api/products?' + params));
    grid.replaceChildren(...(items.length ? items.map(productCard) : [h('p', { class: 'muted' }, 'Is filter mein koi product nahi mila.')]));
  } catch (error) { grid.replaceChildren(h('p', { class: 'muted' }, error.message)); }
}
async function loadBrands() {
  try {
    const items = listOf(await api('/api/products'));
    const brands = [...new Set(items.map((item) => item.brand).filter(Boolean))].sort();
    for (const value of brands) if (![...f.brand.options].some((option) => option.value.toLowerCase() === value.toLowerCase())) f.brand.add(new Option(value, value));
  } catch (_) {}
}
let timer;
f.section.addEventListener('change', () => {
  const accessories = f.section.value === 'accessories';
  document.getElementById('subcategoryFilter').hidden = !accessories;
  document.querySelectorAll('[data-spec-filter]').forEach((label) => { label.hidden = accessories; });
  if (accessories) specFieldIds.forEach((id) => { f[id].value = ''; });
});
for (const id of fields) f[id].addEventListener(f[id].tagName === 'INPUT' ? 'input' : 'change', () => { clearTimeout(timer); timer = setTimeout(load, 250); });
loadBrands(); load();
</script>
</body>
</html>
