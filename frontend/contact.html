<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | Vansh Computer</title><link rel="stylesheet" href="css/site.css"></head><body><div id="hdr"></div><main class="wrap"><h1>Contact us</h1><div class="store"><div><h2>Business contact</h2><p data-business="legalName"></p><p data-business="storeAddress"></p><p data-business="hours"></p><p><a data-business-href="phone" data-business-text="phone"></a></p><p><a data-business-href="email" data-business-text="email"></a></p><p>GSTIN: <span data-business="gstin"></span></p></div><div><h2>Grievance officer</h2><p>Name: <span data-grievance="name"></span></p><p>Email: <span data-grievance="email"></span></p><p>Phone: <span data-grievance="phone"></span></p><a href="https://maps.app.goo.gl/LvvZbApBRxbzKYFV8?g_st=ic" target="_blank" rel="noopener">Open Google Maps</a></div></div></main><div id="ftr"></div><script src="js/business.js"></script><script src="js/common.js"></script><script>renderChrome();document.querySelectorAll('[data-business]').forEach((el)=>el.textContent=BUSINESS[el.dataset.business]);document.querySelectorAll('[data-grievance]').forEach((el)=>el.textContent=BUSINESS.grievanceOfficer[el.dataset.grievance]);document.querySelectorAll('[data-business-href]').forEach((el)=>{const key=el.dataset.businessHref;el.href=key==='phone'?'tel:'+BUSINESS.phone.replace(/\s/g,''):'mailto:'+BUSINESS.email;el.textContent=BUSINESS[key]});</script></body></html>
